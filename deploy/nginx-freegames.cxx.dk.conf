# nginx server block for freegames.cxx.dk
# Install as /etc/nginx/conf.d/freegames.cxx.dk.conf
#   (or sites-available/ + a symlink in sites-enabled/ on Debian-style setups)
# TLS:     certbot --nginx -d freegames.cxx.dk   (adds the 443 block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name freegames.cxx.dk;

    # Only public/ is web-reachable. config.php, src/, bin/, data/ stay private.
    root /var/www/freegames.cxx.dk/public;
    index index.php;

    access_log /var/log/nginx/freegames.cxx.dk.access.log;
    error_log  /var/log/nginx/freegames.cxx.dk.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_index index.php;
        fastcgi_pass unix:/run/php-fpm-cxx.sock;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. { deny all; }
}
