# /etc/nginx/sites-available/games.cxx.dk
# Enable:  ln -s /etc/nginx/sites-available/games.cxx.dk /etc/nginx/sites-enabled/
# TLS:     certbot --nginx -d games.cxx.dk   (adds the 443 block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name games.cxx.dk;

    # Only public/ is web-reachable. config.php, src/, bin/, data/ stay private.
    root /var/www/games.cxx.dk/public;
    index index.php;

    access_log /var/log/nginx/games.cxx.dk.access.log;
    error_log  /var/log/nginx/games.cxx.dk.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php-fpm-cxx.sock;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. { deny all; }
}
